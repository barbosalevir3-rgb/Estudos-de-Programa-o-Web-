<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <h1>Formulário do Cadastro</h1>

    <form>

        <!-- Texto -->
        <label>Nome:</label>
        <input type="text" placeholder="Digite seu nome">
        <br><br>

        <!-- Senha -->
        <label>Senha:</label>
        <input type="password" placeholder="Digite sua senha:">
        <br><br>

        <!-- Data -->
        <label>Data de Nascimento:</label>
        <input type="date">
        <br><br>

        <!-- Checkbox -->
        <label>Interesses:</label><br>

        <input type="checkbox">
        Programação<br>

        <input type="checkbox">
        Redes de Computadores<br>

        <input type="checkbox">
        Banco de Dados<br>

        <br><br>

        <!-- Radio -->
        <label>Sexo:</label><br>

        <input type="radio" name="sexo" value="masculino">
        Masculino<br>

        <input type="radio" name="sexo" value="feminino">
        Feminino<br>

        <input type="radio" name="sexo" value="outro">
        Outro<br>

        <br><br>

        <!--Range-->
        <label>Nivel de conhecimento</label><br>
        <input type="range" min="0" max="10">
        <br><br>

        <!--Upload de Arquivo-->
        <label>Enviar Arquivo</label>
        <input type="file">
        <br><br>

        <!--Botão enviar-->
        <input type="submit" value="enviar">

    </form>

</body>
</html>
