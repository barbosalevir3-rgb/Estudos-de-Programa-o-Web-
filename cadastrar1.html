<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Aluno</title>
      <!-- IMPORTAÇÃO DO BOOTSTRAP 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- ARQUIVO DE ESTILOS PERSONALIZADOS -->
    <link rel="stylesheet" href="assets/css/style.css">.
</head>
<body>
    <!--Menu de Navegação-->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <!--Nome do Sistema-->
            <a class="navbar-brand fw-bold" href="index.html">
               Sistema de Alunos
            </a>
            <!--Botão do Menu Para Dispositivo Móvel-->
            <button class="navbar-toggler" type="button"
            data-bs-toggle="collapse"
            data-bs-target="#menu">
            <span class="navbar-toggler-icon"></span>
            </button>
            <!--Opções de Navegação-->
            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav ms-auto">
                    <!--Primeira Opção: Inicio-->
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">
                            Início 
                        </a>
                    </li>
                    <!--Segunda Opção: Cadastrar Aluno-->
                    <li class="nav-item">
                        <a class="nav-link active" href="cadastrar.html">
                            Cadastrar Aluno
                        </a>

                    </li>
                </ul>
            </div>
        </div>
    </nav> <!--Fim do Menu de Navegação-->

    <main class="container py-4">
        <!--Titulo r descrição da Página-->
        <div class="mb-4">
            <h1 class="h3">Cadastrar Aluno</h1>
            <p class="text-secondary">
                Preencher os dados para cadastrar um estudante.
            </p>
        </div>
        <!--Formulário de Cadastro-->
        <div class="card shadow-sm">
            <div class="card-body">
                <form>
                    <div class="row g-3">
                        <!--Campo: Nome Completo-->
                        <div class="col-md-8">
                            <label class="form-label">
                                Nome completo 
                            </label>
                            <input type="text"
                            class="form-control"
                            placeholder="Digite o nome do aluno">
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
